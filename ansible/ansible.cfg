[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
remote_user          = ansible
private_key_file     = ~/.ssh/id_ed25519
host_key_checking    = False
vault_password_file  = /run/vault_pass
retry_files_enabled  = False
interpreter_python   = auto_silent
nocows               = 1
forks                = 5
timeout              = 20

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o ServerAliveInterval=15 -o UserKnownHostsFile=/dev/null
